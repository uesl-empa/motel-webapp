services:

  ## --------------------------------------
  ## Use Ontotext GraphDB as graph database
  ## --------------------------------------
  graphdb:
    image: "ontotext/graphdb:10.8.10"
    restart: unless-stopped
    command: [
      "-Dgraphdb.workbench.importDirectory=/var/graphdb/import"
    ]
    volumes:
      - graphdb-home:/opt/graphdb/home
      - ./app/data:/var/graphdb/import:ro
    ports:
     - "7200:7200"
    healthcheck:
      test: [
        "CMD-SHELL", "curl -f http://localhost:7200/rest/repositories || exit 1"
      ]
      interval: 10s
      timeout: 5s
      retries: 10

  ## -------------------------------------------------
  ## Use GraphDB's REST API to create a new repository
  ## -------------------------------------------------
  graphdb-setup:
    image: "ontotext/graphdb:10.8.10"
    environment:
      - GRAPHDB_REPO_NAME=MOTEL
    volumes:
      - ./api:/api:ro
    entrypoint: [
      "/bin/sh", "-c",  "/api/setup.sh"
    ]
    depends_on:
      graphdb:
        condition: service_healthy

  ## -------------------------------------------------
  ## Seed repository with ontology data when empty
  ## -------------------------------------------------
  graphdb-seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - GRAPHDB_URL=http://graphdb:7200
      - GRAPHDB_REPOSITORY=${GRAPHDB_REPOSITORY:-MOTEL}
      - GRAPHDB_SEED_REPLACE=${GRAPHDB_SEED_REPLACE:-false}
    command: ["python", "app/scripts/seed_graphdb.py"]
    depends_on:
      graphdb:
        condition: service_healthy
      graphdb-setup:
        condition: service_completed_successfully

  ## --------------------------------------
  ## Use FastAPI backend API service
  ## --------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=${BACKEND_PORT:-8000}
      - BACKEND_CORS_ALLOWED_ORIGINS=${BACKEND_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - GRAPHDB_URL=http://graphdb:7200
      - GRAPHDB_REPOSITORY=${GRAPHDB_REPOSITORY:-MOTEL}
      - BACKEND_DRAFTS_DB_PATH=/app/backend/output/drafts.sqlite
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    volumes:
      - backend-output:/app/backend/output
    depends_on:
      graphdb:
        condition: service_healthy
      graphdb-setup:
        condition: service_completed_successfully
      graphdb-seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; port=os.getenv('BACKEND_PORT', '8000'); urllib.request.urlopen(f'http://localhost:{port}/api/filter/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  ## --------------------------------------
  ## Use Next.js frontend web application
  ## --------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-output:
  graphdb-home:

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1400
